name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ─── Python 后端打包 ─────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt pyinstaller

      - name: Package backend with PyInstaller
        run: |
          cd backend
          pyinstaller --onefile --name open_assistant_backend app/main.py

      # ─── 前端 Electron 打包 ───────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Copy backend binary
        run: |
          mkdir -p frontend/resources/backend
          cp backend/dist/open_assistant_backend.exe frontend/resources/backend/

      - name: Build Electron app
        run: npm run build:electron
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── 发布 Release ────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: |
            frontend/dist/*.exe
            frontend/dist/*.zip
